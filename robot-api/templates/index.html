<!DOCTYPE html>
<html>
<head>
  <title>Robot Dashboard</title>

  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    h2 {
      margin-bottom: 15px;
      border-bottom: 1px solid #334155;
      padding-bottom: 5px;
    }

    p {
      font-size: 18px;
      margin: 8px 0;
    }

    /* STATUS COLORS */
    .online { color: #22c55e; font-weight: bold; }
    .offline { color: #ef4444; font-weight: bold; }

    /* BUTTONS */
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      justify-items: center;
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.05);
      opacity: 0.9;
    }

    .forward { background: #22c55e; }
    .stop { background: #ef4444; }
    .turn { background: #3b82f6; }
    .mode { background: #f59e0b; }

    .mode-buttons {
      display: flex;
      gap: 10px;
    }

  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

  <h1>Robot Control Dashboard</h1>

  <!-- TELEMETRY -->
  <div class="card">
    <h2>Telemetry</h2>
    <p><strong>Distance:</strong> <span id="distance">--</span> cm</p>
    <p><strong>Status:</strong> <span id="status" class="offline">--</span></p>
    <p><strong>Time:</strong> <span id="timestamp">--</span></p>
    <p><strong>Mode:</strong> <span id="mode">--</span></p>
  </div>

  <!-- CONTROLS -->
  <div class="card">
    <h2>Controls</h2>
    <div class="controls">
      <div></div>
      <button class="forward" onclick="sendCommand('forward')">↑</button>
      <div></div>

      <button class="turn" onclick="sendCommand('left')">←</button>
      <button class="stop" onclick="sendCommand('stop')">■</button>
      <button class="turn" onclick="sendCommand('right')">→</button>

      <div></div>
      <button class="forward" onclick="sendCommand('backward')">↓</button>
      <div></div>
    </div>
  </div>

  <!-- MODES -->
  <div class="card">
    <h2>Modes</h2>
    <div class="mode-buttons">
      <button class="mode" onclick="sendCommand('auto')">Auto</button>
      <button class="mode" onclick="sendCommand('manual')">Manual</button>
    </div>
  </div>

  <!-- GRAPH -->
  <div class="card">
    <h3>Distance Over Time</h3>
    <canvas id="distanceChart"></canvas>
  </div>

</div>

<script>
  const API_BASE = "http://127.0.0.1:5000";
  
  const ctx = document.getElementById('distanceChart').getContext('2d');

  const data = {
    labels: [],   // timestamps
    datasets: [{
      label: 'Distance (cm)',
      data: [],
      borderColor: '#4fc3f7',
      backgroundColor: 'rgba(79, 195, 247, 0.2)',
      tension: 0.2
    }]
  };

  const config = {
    type: 'line',
    data: data,
    options: {
      responsive: true,
      animation: false,
      scales: {
        x: {
          title: { display: true, text: 'Time'}
        },
        y: {
          title: { display: true, text: 'Distance (cm)'}
        }
      }
    }
  };

  const distanceChart = new Chart(ctx, config)
  function sendCommand(cmd) {
    fetch(`${API_BASE}/move`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ command: cmd })
    });
  }

  function updateTelemetry() {
    fetch(`${API_BASE}/telemetry`)
      .then(res => res.json())
      .then(data => {

        document.getElementById('distance').innerText =
          data.distance !== null ? data.distance : "No Data";

        document.getElementById('status').innerText = data.status || "Connected";
        document.getElementById('status').className = "online";

        const mode = document.getElementById('mode');
        mode.innerText = data.mode || "No Data";

        // status color
        if (data.mode === "auto" || data.mode === "manual") {
          mode.className = "online";
        } else {
          mode.className = "offline";
        }

        // time formatting
        const date = new Date(data.timestamp * 1000);
        document.getElementById('timestamp').innerText =
          date.toLocaleTimeString();
        
        if (data.distance !== null && !isNaN(data.distance)) {
          distanceChart.data.labels.push(date.toLocaleTimeString());
          distanceChart.data.datasets[0].data.push(data.distance);
        }

        // Limit to last 20 points
        if (distanceChart.data.labels.length > 20) {
          distanceChart.data.labels.shift();
          distanceChart.data.datasets[0].data.shift();
        }

        distanceChart.update();
      })
      .catch(() => {
        const statusEl = document.getElementById('status');
        statusEl.innerText = "Disconnected";
        statusEl.className = "offline";
      });
  }
  setInterval(updateTelemetry, 500);
</script>

</body>
</html>
