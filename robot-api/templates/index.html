<!DOCTYPE html>
<html>
<head>
  <title>Robot Dashboard</title>
  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      margin: 20px auto;
      width: 300px;
      border-radius: 10px;
    }

    button {
      padding: 15px;
      margin: 5px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .forward { background: #22c55e; }
    .stop { background: #ef4444; }
    .turn { background: #3b82f6;}
    .mode { background: #FFA500}
  </style>
</head>

<body>
  <h1>🤖 Robot Dashboard</h1>

  <div class="card">
    <h2>Telemetry</h2>
    <p>Distance: <span id="distance">--</span> cm</p>
    <p>Status: <span id="status">Loading...</span></p>
    <p>Time: <span id="timestamp">Loading...</span></p>
  </div>

  <div class="card">
    <h2>Controls</h2>
    <button class="forward" onclick="sendCommand('forward')">Forward</button><br>
    <button class="turn" onclick="sendCommand('left')">Left</button>
    <button class="stop" onclick="sendCommand('stop')">Stop</button>
    <button class="turn" onclick="sendCommand('right')">Right</button><br>
    <button class="forward" onclick="sendCommand('backward')">Backward</button>
  </div>

  <div class = "card">
    <h2>Modes</h2>
    <button class="mode" onclick="sendCommand('auto')">Auto</button>
    <button class ="mode" onclick="sendCommand('manual')">Manual</button>
  </div>

  <script>
    function sendCommand(cmd) {
      fetch('http://127.0.0.1:5000/move', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ command: cmd })
      })
      .then(res => res.json())
      .then(data => console.log(data));
    }

    function updateDistance() {
      fetch('http://127.0.0.1:5000/distance')
        .then(res => res.json())
        .then(data => {
          document.getElementById('distance').innerText =
            data.distance !== null ? data.distance : "No data";
        });
    }

    function updateTelemetry() {
      fetch('http://127.0.0.1:5000/telemetry')
        .then(res => res.json())
        .then(data => {

          document.getElementById('distance').innerText = 
            data.distnace !== null ? data.distance : "No Data"

          document.getElementById('status').innerText = 
            data.mode !== null ? data.mode : "No Data"

          const date = new Date(data.timestamp * 1000);
          document.getElementById('timestamp').innerText = 
            date.toLocaleTimeString();
        });
    }

    // refresh every 250ms
    setInterval(updateTelemetry, 250);
  </script>
</body>
</html>
